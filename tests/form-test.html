<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Test</title>
</head>
<body>
    <h1>Formular Test</h1>
    
    <form id="testForm">
        <div>
            <label>Titel:</label>
            <input type="text" id="taskTitle" value="Test Aufgabe" required>
        </div>
        <div>
            <label>Mitarbeiter:</label>
            <input type="text" id="taskEmployee" value="Max Mustermann" required>
        </div>
        <div>
            <label>Standort:</label>
            <input type="text" id="taskLocation" value="Gewächshaus 1" required>
        </div>
        <div>
            <label>Beschreibung:</label>
            <textarea id="taskDescription">Test Beschreibung</textarea>
        </div>
        <button type="submit">Absenden</button>
    </form>
    
    <div id="output"></div>
    
    <script src="../src/js/security.js"></script>
    <script>
        document.getElementById('testForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const output = document.getElementById('output');
            output.textContent = '';

            const heading = document.createElement('h2');
            heading.textContent = 'Debug Info:';
            output.appendChild(heading);

            const secLoaded = document.createElement('p');
            secLoaded.textContent = 'Security loaded: ' + (typeof Security !== 'undefined');
            output.appendChild(secLoaded);

            if (typeof Security !== 'undefined') {
                const taskData = {
                    title: Security.sanitizeText(document.getElementById('taskTitle').value),
                    employee: Security.sanitizeText(document.getElementById('taskEmployee').value),
                    location: Security.sanitizeText(document.getElementById('taskLocation').value),
                    description: Security.sanitizeText(document.getElementById('taskDescription').value),
                    status: 'pending'
                };

                const taskLabel = document.createElement('p');
                taskLabel.textContent = 'Task Data:';
                output.appendChild(taskLabel);
                const taskPre = document.createElement('pre');
                taskPre.textContent = JSON.stringify(taskData, null, 2);
                output.appendChild(taskPre);

                const validation = Security.validateTask(taskData);
                const valLabel = document.createElement('p');
                valLabel.textContent = 'Validation Result:';
                output.appendChild(valLabel);
                const valPre = document.createElement('pre');
                valPre.textContent = JSON.stringify(validation, null, 2);
                output.appendChild(valPre);

                const resultMsg = document.createElement('p');
                if (validation.valid) {
                    resultMsg.style.color = 'green';
                    resultMsg.textContent = '\u2705 Validation passed!';
                } else {
                    resultMsg.style.color = 'red';
                    resultMsg.textContent = '\u274C Validation failed!';
                }
                output.appendChild(resultMsg);
            }
        });
    </script>
</body>
</html>

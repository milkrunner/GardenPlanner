name: Build and Publish Docker Image

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync package-lock.json
        run: npm install --package-lock-only

      - name: Extract version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determine Docker tags
        id: tags
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/gardenplanner"
          VERSION="${{ steps.pkg.outputs.version }}"
          BUILD="${{ github.run_number }}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "tags=${IMAGE}:beta,${IMAGE}:${VERSION}-beta,${IMAGE}:${VERSION}-beta.${BUILD}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image (lokal)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gardenplanner:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan (HIGH/CRITICAL — blockierend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gardenplanner:local'
          format: 'table'
          output: 'trivy-critical.txt'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          vuln-type: 'os,library'

      - name: Trivy Scan (MEDIUM — nicht blockierend)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gardenplanner:local'
          format: 'table'
          output: 'trivy-report.txt'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          vuln-type: 'os,library'

      - name: Trivy Scan Summary
        if: always()
        run: |
          echo "## Trivy Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** gardenplanner:local" >> $GITHUB_STEP_SUMMARY
          echo "**Blocking:** HIGH, CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "**Warning:** MEDIUM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s trivy-report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Keine Schwachstellen gefunden." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-report
          path: trivy-report.txt
          retention-days: 30

      - name: Docker Image taggen und pushen
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            docker tag gardenplanner:local "$tag"
            docker push "$tag"
          done

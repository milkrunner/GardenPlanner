<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gartenplaner - Garten gestalten</title>
    <meta
      name="description"
      content="Interaktiver Gartenplaner zum Gestalten von Gartenanlagen"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>"
    />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#365E3D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/icons/icon-192.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/styles.css" />
    <link rel="stylesheet" href="../src/css/garden.css" />
  </head>
  <body>
    <a href="#main" class="skip-to-main">Zum Inhalt springen</a>
    <script src="../src/js/auth-check.js"></script>

    <div class="garden-app">
      <!-- Header -->
      <header class="garden-header" role="banner">
        <div class="garden-header-left">
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Seitenleiste umschalten" title="Seitenleiste umschalten">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <div class="garden-title-group">
            <span class="garden-title-icon">🌻</span>
            <input type="text" class="garden-name-input" id="gardenNameInput" value="Mein Garten" placeholder="Gartenname..." aria-label="Gartenname" maxlength="60" />
          </div>
        </div>

        <div class="garden-header-center">
          <!-- Toolbar -->
          <div class="garden-toolbar" role="toolbar" aria-label="Zeichenwerkzeuge">
            <button type="button" class="tool-btn active" data-tool="select" title="Auswahl (V)" aria-label="Auswahl-Werkzeug">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
            </button>
            <button type="button" class="tool-btn" data-tool="draw" title="Zeichnen (D)" aria-label="Polygon zeichnen">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/></svg>
            </button>
            <button type="button" class="tool-btn" data-tool="move" title="Verschieben (M)" aria-label="Verschieben">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg>
            </button>
            <button type="button" class="tool-btn" data-tool="delete" title="Loeschen (X)" aria-label="Loeschen">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14H7L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </div>
        </div>

        <div class="garden-header-right">
          <button type="button" class="header-btn" id="undoBtn" title="Rückgängig (Ctrl+Z)" aria-label="Rückgängig" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </button>
          <button type="button" class="header-btn" id="redoBtn" title="Wiederholen (Ctrl+Y)" aria-label="Wiederholen" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
          </button>

          <span class="header-separator"></span>

          <button type="button" class="header-btn" id="exportBtn" title="Als PNG exportieren" aria-label="Exportieren">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button type="button" class="header-btn header-btn--primary" id="saveBtn" title="Speichern (Ctrl+S)" aria-label="Speichern">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span class="btn-label">Speichern</span>
          </button>
        </div>
      </header>

      <!-- Nav -->
      <div class="nav-container">
        <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Navigation umschalten" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <nav class="main-nav" role="navigation" aria-label="Hauptnavigation">
          <a href="/dashboard" class="nav-link">📋 Dashboard</a>
          <a href="/statistics" class="nav-link">📊 Statistiken</a>
          <a href="/plants" class="nav-link">🌱 Pflanzen</a>
          <a href="/garden" class="nav-link active" aria-current="page">🌻 Garten</a>
          <a href="/logs" class="nav-link">📜 Logs</a>
        </nav>
        <a href="/index" class="btn btn-primary nav-action-btn">➕ Neue Aufgabe</a>
      </div>

      <!-- Main Content -->
      <div class="garden-workspace" id="main">
        <!-- Sidebar -->
        <aside class="garden-sidebar" id="gardenSidebar" aria-label="Werkzeugpalette">
          <!-- Surface Types -->
          <div class="sidebar-section">
            <h3 class="sidebar-section-title">Flächen</h3>
            <div class="surface-palette" id="surfacePalette">
              <!-- Filled by JS -->
            </div>
          </div>

          <!-- Plants -->
          <div class="sidebar-section">
            <h3 class="sidebar-section-title">Pflanzen</h3>
            <div class="sidebar-search">
              <input type="text" class="sidebar-search-input" id="plantSearch" placeholder="Pflanze suchen..." aria-label="Pflanzen suchen" />
            </div>
            <div class="plant-palette" id="plantPalette">
              <!-- Filled by JS -->
            </div>
          </div>

          <!-- Structures -->
          <div class="sidebar-section">
            <h3 class="sidebar-section-title">Strukturen</h3>
            <div class="structure-palette" id="structurePalette">
              <!-- Filled by JS -->
            </div>
          </div>

          <!-- Saved Gardens -->
          <div class="sidebar-section">
            <h3 class="sidebar-section-title">Gespeicherte Gärten</h3>
            <div class="saved-gardens-list" id="savedGardensList">
              <!-- Filled by JS -->
            </div>
          </div>
        </aside>

        <!-- Canvas Area with Rulers -->
        <div class="garden-canvas-wrapper">
          <canvas class="garden-ruler-corner" id="rulerCorner" width="32" height="24"></canvas>
          <canvas class="garden-ruler-top" id="rulerTop" height="24"></canvas>
          <canvas class="garden-ruler-left" id="rulerLeft" width="32"></canvas>
          <div class="garden-canvas-area" id="gardenCanvasArea">
            <svg class="garden-canvas" id="gardenCanvas" xmlns="http://www.w3.org/2000/svg">
              <defs id="svgDefs">
                <!-- SVG Patterns defined by JS -->
              </defs>
              <g id="canvasContent">
                <g id="layerGrid"></g>
                <g id="layerAreas"></g>
                <g id="layerElements"></g>
                <g id="layerDrawing"></g>
              </g>
            </svg>
            <div class="garden-tooltip" id="gardenTooltip" role="tooltip"></div>
          </div>
        </div>
      </div>

      <!-- Status Bar -->
      <div class="garden-statusbar">
        <div class="statusbar-left">
          <span class="status-text" id="statusText">Bereit</span>
        </div>
        <div class="statusbar-center">
          <span class="status-stat" id="statusAreas">0 Flächen</span>
          <span class="status-separator">|</span>
          <span class="status-stat" id="statusElements">0 Elemente</span>
          <span class="status-separator">|</span>
          <span class="status-stat" id="statusCanvasSize">12.0 x 8.0 m</span>
        </div>
        <div class="statusbar-right">
          <select class="grid-scale-select" id="gridScaleSelect" aria-label="Rastergröße" title="Rastergröße">
            <option value="0.25">0.25m</option>
            <option value="0.5" selected>0.5m</option>
            <option value="1">1m</option>
          </select>
          <span class="header-separator"></span>
          <button type="button" class="zoom-btn" id="zoomOut" title="Verkleinern" aria-label="Verkleinern">−</button>
          <span class="zoom-level" id="zoomLevel">100%</span>
          <button type="button" class="zoom-btn" id="zoomIn" title="Vergrößern" aria-label="Vergrößern">+</button>
          <button type="button" class="zoom-btn" id="zoomReset" title="Zoom zurücksetzen" aria-label="Zoom zurücksetzen">⟲</button>
        </div>
      </div>

      <footer role="contentinfo">
        <p>&copy; 2025 Gartenplaner <span class="app-version" id="appVersion"></span></p>
      </footer>
    </div>

    <!-- Dark Mode Toggle -->
    <div class="theme-toggle">
      <button
        id="themeToggle"
        class="theme-toggle-btn"
        aria-label="Theme umschalten"
        title="Dark Mode umschalten"
      >
        <svg
          id="themeIcon"
          class="theme-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <script src="../src/js/garden-planner.js"></script>
    <script src="../src/js/offline-store.js"></script>
    <script src="../src/js/sync-manager.js"></script>
    <script src="../src/js/offline-ui.js"></script>
    <script src="../src/js/pwa-register.js"></script>
  </body>
</html>

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gartenplaner - Log Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/styles.css" />
  </head>
  <body>
    <script>
        fetch('/api/v1/auth/status', { credentials: 'same-origin' })
            .then(r => r.json())
            .then(data => {
                if (data.authRequired && !data.user) window.location.href = '/login';
                if (data.user) {
                    window.__user = data.user;
                    const nav = document.querySelector('nav ul') || document.querySelector('.main-nav');
                    if (nav && data.user.role === 'admin') {
                        const adminLink = document.createElement('a');
                        adminLink.href = '/admin';
                        adminLink.className = 'nav-link';
                        adminLink.textContent = 'Admin';
                        nav.appendChild(adminLink);
                    }
                    if (nav) {
                        const logoutLink = document.createElement('a');
                        logoutLink.href = '#';
                        logoutLink.className = 'nav-link';
                        logoutLink.textContent = 'Logout';
                        logoutLink.addEventListener('click', function(e) {
                            e.preventDefault();
                            if (window.TaskAPI) TaskAPI.logout();
                            else fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }).then(function() { window.location.href = '/login'; });
                        });
                        nav.appendChild(logoutLink);
                    }
                }
            });
    </script>
    <div class="log-viewer-container">
      <header>
        <h1>📊 System Logs</h1>

        <div class="nav-container">
          <nav class="main-nav" aria-label="Hauptnavigation">
            <a href="/dashboard" class="nav-link">📋 Dashboard</a>
            <a href="/statistics" class="nav-link">📊 Statistiken</a>
            <a href="/plants" class="nav-link">🌱 Pflanzen</a>
            <a href="/garden" class="nav-link">🌻 Garten</a>
            <a href="/logs" class="nav-link active" aria-current="page"
              >📜 Logs</a
            >
          </nav>
          <a href="/index" class="btn btn-primary nav-action-btn"
            >➕ Neue Aufgabe</a
          >
        </div>
      </header>

      <main>
        <!-- Statistiken -->
        <section class="log-stats" id="logStats" aria-label="Log-Statistiken">
          <div class="stat-item">
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">Total Logs</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statErrors">0</div>
            <div class="stat-label">Errors (1h)</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statCategories">0</div>
            <div class="stat-label">Categories</div>
          </div>
          <div class="stat-item">
            <div class="stat-value" id="statSize">0 KB</div>
            <div class="stat-label">Log Size</div>
          </div>
        </section>

        <!-- Filter und Aktionen -->
        <section class="log-controls" aria-label="Filter und Aktionen">
          <div class="log-filters">
            <div class="filter-group">
              <label for="filterLevel">Log Level</label>
              <select id="filterLevel">
                <option value="">Alle Levels</option>
                <option value="DEBUG">Debug</option>
                <option value="INFO">Info</option>
                <option value="WARN">Warnung</option>
                <option value="ERROR">Error</option>
                <option value="CRITICAL">Critical</option>
              </select>
            </div>

            <div class="filter-group">
              <label for="filterCategory">Kategorie</label>
              <select id="filterCategory">
                <option value="">Alle Kategorien</option>
                <option value="app">App</option>
                <option value="security">Security</option>
                <option value="storage">Storage</option>
                <option value="encryption">Encryption</option>
                <option value="rate-limit">Rate Limit</option>
                <option value="performance">Performance</option>
              </select>
            </div>

            <div class="filter-group">
              <label for="filterSearch">Suche</label>
              <input
                type="text"
                id="filterSearch"
                placeholder="Suche in Logs..."
              />
            </div>

            <div class="filter-group">
              <label for="filterLimit">Limit</label>
              <select id="filterLimit">
                <option value="50">50 Einträge</option>
                <option value="100" selected>100 Einträge</option>
                <option value="200">200 Einträge</option>
                <option value="">Alle Einträge</option>
              </select>
            </div>
          </div>

          <div class="log-actions">
            <button class="btn btn-primary" onclick="logViewer.refresh()">
              🔄 Aktualisieren
            </button>
            <button class="btn" onclick="logViewer.exportJSON()">
              💾 Export JSON
            </button>
            <button class="btn" onclick="logViewer.exportCSV()">
              📊 Export CSV
            </button>
            <button class="btn" onclick="logViewer.exportText()">
              📄 Export Text
            </button>
            <button class="btn btn-danger" onclick="logViewer.clearLogs()">
              🗑️ Logs löschen
            </button>
            <div style="margin-left: auto">
              <span id="healthIndicator" class="health-indicator" role="status"></span>
            </div>
          </div>
        </section>

        <!-- Log-Tabelle -->
        <section class="log-table-container" aria-label="Log-Eintraege">
          <table class="log-table">
            <thead>
              <tr>
                <th>Zeit</th>
                <th>Level</th>
                <th>Kategorie</th>
                <th>Nachricht</th>
                <th>Context</th>
              </tr>
            </thead>
            <tbody id="logTableBody">
              <tr>
                <td colspan="5">
                  <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <p>Lade Logs...</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <!-- Detail Modal -->
    <div class="log-detail-modal" id="logDetailModal" role="dialog" aria-modal="true" aria-label="Log-Detail">
      <div class="log-detail-content">
        <button class="log-detail-close" onclick="logViewer.closeDetail()" aria-label="Dialog schliessen">
          ×
        </button>
        <div id="logDetailContent"></div>
      </div>
    </div>

    <script src="../src/js/logger.js"></script>
    <script src="../src/js/log-viewer.js"></script>

    <!-- Dark Mode Toggle -->
    <div class="theme-toggle">
      <button
        id="themeToggle"
        class="theme-toggle-btn"
        aria-label="Theme umschalten"
        title="Dark Mode umschalten"
      >
        <svg
          id="themeIcon"
          class="theme-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <script src="../src/js/config.js"></script>
    <script src="../src/js/security.js"></script>
    <script src="../src/js/encryption.js"></script>
    <script src="../src/js/rate-limiter.js"></script>
    <script src="../src/js/logger.js"></script>
    <script src="../src/js/error-handler.js"></script>
    <script src="../src/js/api.js"></script>
    <script src="../src/js/app.js"></script>
    <script src="../src/js/task-state.js"></script>
    <script src="../src/js/task-filters.js"></script>
    <script src="../src/js/task-renderer.js"></script>
    <script src="../src/js/task-events.js"></script>
    <script src="../src/js/task-export.js"></script>
  </body>
</html>

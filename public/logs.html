<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gartenplaner - Log Viewer</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <link rel="stylesheet" href="../src/css/logs.css">
</head>
<body>
    <div class="log-viewer-container">
        <h1>📊 System Logs</h1>
        
        <nav class="main-nav">
            <a href="/index" class="nav-link">➕ Neue Aufgabe</a>
            <a href="/dashboard" class="nav-link">📋 Dashboard</a>
            <a href="/statistics" class="nav-link">📊 Statistiken</a>
            <a href="/plants" class="nav-link">🌱 Pflanzen</a>
            <a href="/logs" class="nav-link active">📊 Logs</a>
        </nav>

        <!-- Statistiken -->
        <div class="log-stats" id="logStats">
            <div class="stat-item">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total Logs</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statErrors">0</div>
                <div class="stat-label">Errors (1h)</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statCategories">0</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statSize">0 KB</div>
                <div class="stat-label">Log Size</div>
            </div>
        </div>

        <!-- Filter und Aktionen -->
        <div class="log-controls">
            <div class="log-filters">
                <div class="filter-group">
                    <label>Log Level</label>
                    <select id="filterLevel">
                        <option value="">Alle Levels</option>
                        <option value="DEBUG">Debug</option>
                        <option value="INFO">Info</option>
                        <option value="WARN">Warnung</option>
                        <option value="ERROR">Error</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Kategorie</label>
                    <select id="filterCategory">
                        <option value="">Alle Kategorien</option>
                        <option value="app">App</option>
                        <option value="security">Security</option>
                        <option value="storage">Storage</option>
                        <option value="encryption">Encryption</option>
                        <option value="rate-limit">Rate Limit</option>
                        <option value="performance">Performance</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Suche</label>
                    <input type="text" id="filterSearch" placeholder="Suche in Logs...">
                </div>

                <div class="filter-group">
                    <label>Limit</label>
                    <select id="filterLimit">
                        <option value="50">50 Einträge</option>
                        <option value="100" selected>100 Einträge</option>
                        <option value="200">200 Einträge</option>
                        <option value="">Alle Einträge</option>
                    </select>
                </div>
            </div>

            <div class="log-actions">
                <button class="btn btn-primary" id="logRefreshBtn">🔄 Aktualisieren</button>
                <button class="btn" id="logExportJsonBtn">💾 Export JSON</button>
                <button class="btn" id="logExportCsvBtn">📊 Export CSV</button>
                <button class="btn" id="logExportTextBtn">📄 Export Text</button>
                <button class="btn btn-danger" id="logClearBtn">🗑️ Logs löschen</button>
                <div style="margin-left: auto;">
                    <span id="healthIndicator" class="health-indicator"></span>
                </div>
            </div>
        </div>

        <!-- Log-Tabelle -->
        <div class="log-table-container">
            <table class="log-table">
                <thead>
                    <tr>
                        <th>Zeit</th>
                        <th>Level</th>
                        <th>Kategorie</th>
                        <th>Nachricht</th>
                        <th>Context</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <div class="empty-state-icon">📋</div>
                                <p>Lade Logs...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="log-detail-modal" id="logDetailModal">
        <div class="log-detail-content">
            <button class="log-detail-close" id="logDetailCloseBtn">×</button>
            <div id="logDetailContent"></div>
        </div>
    </div>

    <script src="../src/js/logger.js"></script>
    <script src="../src/js/log-viewer.js"></script>

    <!-- Dark Mode Toggle -->
    <div class="theme-toggle">
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Theme umschalten" title="Dark Mode umschalten">
            <svg id="themeIcon" class="theme-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <script src="../src/js/config.js"></script>
    <script src="../src/js/security.js"></script>
    <script src="../src/js/encryption.js"></script>
    <script src="../src/js/rate-limiter.js"></script>
    <script src="../src/js/logger.js"></script>
    <script src="../src/js/error-handler.js"></script>
    <script src="../src/js/api.js"></script>
    <script src="../src/js/app.js"></script>
    <script src="../src/js/task-state.js"></script>
    <script src="../src/js/task-filters.js"></script>
    <script src="../src/js/task-renderer.js"></script>
    <script src="../src/js/task-events.js"></script>
    <script src="../src/js/task-export.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pflanzenbibliothek - Gartenplaner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#365E3D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/icons/icon-192.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/styles.css">
    <link rel="stylesheet" href="../src/css/plants.css">
</head>
<body>
    <a href="#main" class="skip-to-main">Zum Inhalt springen</a>
    <script src="../src/js/auth-check.js"></script>
    <div class="container">
        <header role="banner">
            <h1>🌱 Pflanzenbibliothek</h1>
            <p class="subtitle">Pflegeanleitungen und Tipps für Ihren Garten</p>
        </header>

        <div class="nav-container">
            <nav class="main-nav" role="navigation" aria-label="Hauptnavigation">
                <a href="/dashboard" class="nav-link">📋 Dashboard</a>
                <a href="/statistics" class="nav-link">📊 Statistiken</a>
                <a href="/plants" class="nav-link active" aria-current="page">🌱 Pflanzen</a>
                <a href="/garden" class="nav-link">🌻 Garten</a>
                <a href="/calendar" class="nav-link">📅 Kalender</a>
                <a href="/logs" class="nav-link">📜 Logs</a>
            </nav>
            <a href="/index" class="btn btn-primary nav-action-btn">➕ Neue Aufgabe</a>
        </div>

        <main id="main">
            <section class="plant-controls">
                <div class="search-box">
                    <input type="text" id="plantSearch" placeholder="Pflanze suchen..." aria-label="Pflanzen durchsuchen">
                </div>
                <div class="plant-sort-box">
                    <label for="plantSort" class="sr-only">Sortierung</label>
                    <select id="plantSort" aria-label="Pflanzen sortieren">
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="category">Kategorie</option>
                    </select>
                </div>
                <div class="plant-favorites-toggle">
                    <button id="favoritesToggle" class="favorites-toggle-btn" aria-label="Nur Favoriten anzeigen" aria-pressed="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                        Favoriten
                    </button>
                </div>
                <div class="category-filters" id="categoryFilters">
                    <button class="category-btn active" data-category="">Alle</button>
                </div>
            </section>

            <div class="plant-result-count" id="plantResultCount" aria-live="polite"></div>

            <section class="plant-grid" id="plantGrid">
                <div class="ui-state ui-state--loading">
                    <div class="ui-state__spinner" aria-hidden="true"></div>
                    <h3 class="ui-state__title">Lade Pflanzenbibliothek...</h3>
                </div>
            </section>

            <!-- Plant Detail Modal (injected by JS when opened) -->
            <div class="plant-modal" id="plantModal" hidden role="dialog" aria-modal="true" aria-label="Pflanzendetails">
                <div class="plant-modal-content" id="plantModalContent"></div>
            </div>
        </main>

        <footer role="contentinfo">
            <p>&copy; 2025 Gartenplaner <span class="app-version" id="appVersion"></span></p>
        </footer>
    </div>

    <div class="theme-toggle">
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Theme umschalten" title="Dark Mode umschalten">
            <svg id="themeIcon" class="theme-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <script src="../src/js/config.js"></script>
    <script src="../src/js/security.js"></script>
    <script src="../src/js/encryption.js"></script>
    <script src="../src/js/rate-limiter.js"></script>
    <script src="../src/js/logger.js"></script>
    <script src="../src/js/error-handler.js"></script>
    <script src="../src/js/api.js"></script>
    <script src="../src/js/ui-states.js"></script>
    <script src="../src/js/confirm-dialog.js"></script>
    <script src="../src/js/app.js"></script>
    <script src="../src/js/task-state.js"></script>
    <script src="../src/js/task-filters.js"></script>
    <script src="../src/js/task-renderer.js"></script>
    <script src="../src/js/task-events.js"></script>
    <script src="../src/js/task-export.js"></script>
    <script src="../src/js/plants.js"></script>
    <script src="../src/js/offline-store.js"></script>
    <script src="../src/js/sync-manager.js"></script>
    <script src="../src/js/offline-ui.js"></script>
    <script src="../src/js/pwa-register.js"></script>
</body>
</html>
